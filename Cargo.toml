[workspace]
resolver = "3"
members = [
    "crates/tidemark-types",
    "crates/tidemark-ipc",
    "crates/tidemark-core",
    "crates/tidemarkd",
    "crates/tidemark",
    "crates/tidemark-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/zbndev/tidemark"
authors = ["zbndev"]

[workspace.lints.rust]
# Unsafe stays denied workspace-wide. Native Win32 calls and the borrowed Wayland
# display bridge need locally audited exceptions in their platform modules;
# `forbid` cannot be locally overridden, hence `deny`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
