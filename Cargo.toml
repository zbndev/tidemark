[workspace]
resolver = "3"
members = [
    "crates/tidemark-types",
    "crates/tidemark-core",
    "crates/tidemarkd",
    "crates/tidemark",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/zbndev/tidemark"
authors = ["zbndev"]

[workspace.lints.rust]
# Unsafe stays denied workspace-wide. Win32 FFI needs locally-audited `unsafe`, confined
# to `cfg(windows)` modules (Linux builds contain none) — `forbid` cannot be locally
# overridden, hence `deny`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
