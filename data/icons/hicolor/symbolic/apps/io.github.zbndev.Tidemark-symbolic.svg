<!-- Tidemark's own icon, unlike the provider marks beside it in this directory: this one is
     part of the project and is covered by its MIT licence.

     A tidemark is the line the water leaves behind at its highest reach, which is what the
     program is about — not only where a quota is now, but the mark it got to. The datum runs
     the full width because it is the reference the rest is read against; the water is inset
     under it.

     Filled paths only, no strokes: GTK's symbolic loader forces `fill` to the widget's
     foreground colour and leaves `stroke` alone, so a stroked wave would stay black on a
     dark panel. See mark.rs for the same rule applied to the provider marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#000">
  <rect x="1.2" y="3.2" width="13.6" height="1.4" rx="0.7"/>
  <path d="M1.8,8.1 q1.55,-1.9 3.1,0 t3.1,0 t3.1,0 t3.1,0 v1.25 q-1.55,1.9 -3.1,0 t-3.1,0 t-3.1,0 t-3.1,0 Z"/>
  <path d="M1.8,11.6 q1.55,-1.9 3.1,0 t3.1,0 t3.1,0 t3.1,0 v1.25 q-1.55,1.9 -3.1,0 t-3.1,0 t-3.1,0 t-3.1,0 Z"/>
</svg>
