[package]
name = "tidemark-core"
description = "Provider clients, storage and secret handling for Tidemark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
fs4 = "0.13.1"
libc = "0.2.180"
oo7 = { version = "0.6.0", default-features = false, features = ["native_crypto", "tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "json", "gzip", "form"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tidemark-types = { version = "0.1.0", path = "../tidemark-types" }
time = { version = "0.3.47", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
