[package]
name = "tidemark-core"
description = "Provider clients, storage and secret handling for Tidemark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# aes + cbc + pbkdf2 + hmac + sha1: decrypting Chromium's os_crypt cookie values (RustCrypto,
# pure Rust — the workspace's no-OpenSSL rule holds).
aes = "0.9.2"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["block-padding"] }
fs4 = "1.1.0"
hmac = "0.13.0"
libc = "0.2.180"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11.0", default-features = false }
oo7 = { version = "0.6.0", default-features = false, features = ["native_crypto", "tokio"] }
# `socks`: without it a `socks5://` proxy URL parses and then refuses every connection
# made through it. `system-proxy`: what "no proxy configured here" falls back to.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "socks", "json", "gzip", "form", "query"] }
rusqlite = "0.40.2"
rustix = { version = "1.1.4", features = ["process", "pty", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: the default parser may land 1 ULP off the literal, which would
# make a recorded body (parsed by Swift's correctly-rounded reader) and the test
# literal computed from it disagree — Synthetic's golden 98.05884722222223 does.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
tidemark-types = { version = "0.3.1", path = "../tidemark-types" }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
# wreq: the browser-emulating HTTP stack T3 Chat's Vercel edge demands — it gates on the
# client's TLS/HTTP2 fingerprint, and no honest rustls ClientHello passes (see
# `providers/keyed/t3chat.rs`). Pinned below 0.16, which raises the toolchain above this
# workspace's MSRV. `socks`/`system-proxy`: mirror the reqwest feature set so the one
# proxy policy holds on both stacks; the compression features because the Chrome preset
# announces them in `accept-encoding`.
wreq = { version = "~0.15.3", default-features = false, features = ["webpki-roots", "socks", "charset", "gzip", "brotli", "zstd", "deflate"] }
wreq-util = "~0.1.0"
