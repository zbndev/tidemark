[package]
name = "tidemark-core"
description = "Provider clients, storage and secret handling for Tidemark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# aes + cbc + pbkdf2 + hmac + sha1: decrypting Chromium's os_crypt cookie values (RustCrypto,
# pure Rust — the workspace's no-OpenSSL rule holds).
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["block-padding"] }
fs4 = "0.13.1"
hmac = "0.12.1"
libc = "0.2.180"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = { version = "0.10.7", default-features = false }
oo7 = { version = "0.6.0", default-features = false, features = ["native_crypto", "tokio"] }
# `socks`: without it a `socks5://` proxy URL parses and then refuses every connection
# made through it. `system-proxy`: what "no proxy configured here" falls back to.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "socks", "json", "gzip", "form", "query"] }
rusqlite = "0.40.2"
rustix = { version = "1.1.4", features = ["process", "pty", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: the default parser may land 1 ULP off the literal, which would
# make a recorded body (parsed by Swift's correctly-rounded reader) and the test
# literal computed from it disagree — Synthetic's golden 98.05884722222223 does.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
tidemark-types = { version = "0.1.4", path = "../tidemark-types" }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
