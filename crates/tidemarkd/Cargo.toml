[package]
name = "tidemarkd"
description = "Tidemark polling daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["update-check"]
update-check = ["dep:reqwest", "dep:semver"]
# Dev-only: registers the temporary per-user AUMID so toasts can be raised before the
# NSIS installer (todo 21) ships the Start-menu shortcut that registers it for real.
dev-toast-aumid = []

[dependencies]
tidemark-types = { path = "../tidemark-types" }
tidemark-core = { version = "0.3.1", path = "../tidemark-core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
zbus = { version = "5.13.2", features = ["p2p"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"], optional = true }
semver = { version = "1.0.27", optional = true }

[dev-dependencies]
# Only to hold a second write lock against the history database in tests: the same
# version tidemark-core links, so one build of the C library serves the whole workspace.
rusqlite = "0.40.2"

[target.'cfg(windows)'.dependencies]
# AF_UNIX on Windows: std has no sockets there, and this is the transport the locked
# A1 decision (zbus p2p over AF_UNIX) is built on.
uds_windows = "1.2.1"
# Windows crate, one locked release for the whole daemon. Features are the union of its
# consumers: toast notifications (todo 16) - direct WinRT CreateToastNotifierWithId(AUMID),
# ToastNotification with Tag replacement - the lifecycle primitives (todo 14) - singleton
# mutex, job object, Scheduled Task COM, HKCU Run - and the agy supervisor (todo 19) -
# ConPTY, toolhelp process discovery, per-pid TCP tables.
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
