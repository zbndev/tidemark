[package]
name = "tidemark-slint"
description = "Tidemark desktop client, Slint prototype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# Same rule as the GTK client: D-Bus and tidemark-types only, never core, HTTP or SQLite.
# scripts/check-layering.sh enforces this.
[dependencies]
async-io = "2.6.0"
rfd = "0.17.2"
semver = "1.0.28"
# `~`: the winit accessor behind `unstable-winit-030` may change in any minor release.
slint = { version = "~1.18.1", features = ["renderer-femtovg-wgpu", "unstable-winit-030"] }
tidemark-ipc = { path = "../tidemark-ipc" }
tidemark-types = { path = "../tidemark-types" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webbrowser = "1.2.4"
zbus = { version = "5.13.2", features = ["p2p"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # The desktop's light/dark choice and accent colour.
    "Win32_System_Registry",
    # SECURITY_ATTRIBUTES on the mutex signature.
    "Win32_Security",
    # The kill-on-close job that ties a client-spawned daemon to this process.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# AF_UNIX on Windows: std has no sockets there. The daemon serves its p2p endpoint with
# the same crate.
uds_windows = "1.2.1"

[build-dependencies]
slint-build = "1.18.1"
