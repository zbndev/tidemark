[package]
name = "tidemark-slint"
description = "Tidemark desktop client, Slint prototype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# Same rule as the GTK client: D-Bus and tidemark-types only, never core, HTTP or SQLite.
# scripts/check-layering.sh enforces this.
[dependencies]
async-io = "2.6.0"
semver = "1.0.28"
slint = { version = "1.18.1", features = ["renderer-femtovg-wgpu"] }
tidemark-ipc = { path = "../tidemark-ipc" }
tidemark-types = { path = "../tidemark-types" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", features = ["p2p"] }

[build-dependencies]
slint-build = "1.18.1"
