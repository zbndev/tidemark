name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is built until the tree passes the same checks a pull request does, and until
  # the tag agrees with the manifest.
  checks:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries and the shell-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev libsqlite3-dev pkg-config cmake g++ libclang-dev \
            dbus-daemon desktop-file-utils appstream shellcheck

      - name: The tag must agree with Cargo.toml
        run: scripts/check-tag-version.sh "${GITHUB_REF_NAME}"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: dbus-run-session -- cargo test --workspace --locked
      - run: scripts/check-layering.sh
      - run: scripts/check-desktop-integration.sh
      - run: scripts/test-restart-user-daemon.sh
      - run: scripts/test-package-deps.sh
      - run: scripts/test-release.sh
      - run: |
          shellcheck scripts/*.sh data/restart-user-daemon \
            data/packaging/deb/postinst data/packaging/rpm/post-install.sh

  deb:
    needs: checks
    # Building on Ubuntu 26.04 makes it the oldest supported target. glibc is forward- but
    # not backward-compatible,
    # which is the whole reason each format is built on its own target rather than on one
    # shared build host.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install the libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev libsqlite3-dev pkg-config cmake g++ libclang-dev dpkg-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked --workspace
      - run: cargo deb --no-build -p tidemark
      # cargo-deb only *warns* when dpkg-shlibdeps cannot run, and a package declaring no
      # libraries installs happily and then fails to start. This turns that into a failure.
      - name: The dependencies must come from the ELF
        run: scripts/check-package-deps.sh target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  rpm:
    needs: checks
    # GitHub has no Fedora-hosted runner and does not plan one (actions/runner-images
    # issue 2307). A Fedora container on an Ubuntu runner is the standard route; the only
    # alternative is a self-hosted machine. This is the one place Docker appears.
    #
    # It is also a correctness requirement, not just a convenience: cargo-generate-rpm's
    # auto-req scans the payload transitively, so the requires list is the build host's
    # whole shared-library closure. Built anywhere but Fedora it names libraries Fedora
    # numbers differently, and the package will not install.
    runs-on: ubuntu-26.04
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: Bootstrap the container
        run: |
          dnf install -y git gcc gcc-c++ cmake clang-devel fontconfig-devel \
            sqlite-devel pkgconf-pkg-config rpm-build
      - uses: actions/checkout@v5
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-generate-rpm --locked
      - run: cargo build --release --locked --workspace
      - run: cargo generate-rpm -p crates/tidemark
      - name: The dependencies must come from the ELF
        run: scripts/check-package-deps.sh target/generate-rpm/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  # Windows tests gate the tag's setup artifact before a draft release is created.
  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: msvc-static-release
      - name: Windows release checks
        shell: pwsh
        run: |
          . ./scripts/windows-env.ps1
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --workspace --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./data/packaging/windows/test-stage-runtime.ps1
      - name: Build Inno setup
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/build-windows.ps1 -AppVersion ($env:TAG -replace '^v', '')
      - name: Isolated installer tests
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/windows/installer/Tidemark-v*-setup.exe
          if (@($setup).Count -ne 1) { throw 'Expected one setup artifact' }
          ./scripts/test-windows-installer.ps1 -SetupPath $setup.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/windows/installer/Tidemark-v*-setup.exe
          if-no-files-found: error
  # Depends on all four, so a failure anywhere means no release object is created at all.
  # A draft, not a publication: a person decides when it goes out.
  release:
    needs: [checks, deb, rpm, windows]
    runs-on: ubuntu-26.04
    # The one job that writes: creating the draft release is the only mutation anywhere
    # in this workflow, so the build jobs above stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      # The package tools name their outputs the way package managers expect — the -1 is
      # the Debian revision, the suffix the architecture. The file a person downloads gets
      # the project's own name instead, shaped by the tag the checks job has already
      # agreed with Cargo.toml. The Windows installer arrives already named that way,
      # so there is nothing here to rename it from.
      - name: Give the assets their release names
        run: |
          mv artifacts/*.deb "artifacts/Tidemark-${GITHUB_REF_NAME}.deb"
          mv artifacts/*.rpm "artifacts/Tidemark-${GITHUB_REF_NAME}.rpm"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
