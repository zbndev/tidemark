name: CI

on:
  pull_request:
    paths-ignore:
      # '**/*.md' does not match repository-root files (README, CONTEXT, AGENTS) — the
      # root-level '*.md' entry is what closes that gap.
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  push:
    # `main` only, and so tags too are excluded by saying so: a tag push belongs to the
    # release workflow, which runs this same Linux gate itself before it builds anything.
    #
    # A branch push is deliberately not here. A branch with a pull request open is already
    # covered by the `pull_request` event above, and better: that event builds the merge
    # commit, so it answers "does this pass *on top of main*" rather than "did it pass on
    # a branch cut some time ago". Listing every branch here ran both for every push, one
    # of them redundantly — the two events produce different refs, so `concurrency` below
    # never collapsed them. Before a pull request exists, the local gate in `CLAUDE.md` is
    # the one that matters. `nix.yml` has always been shaped this way.
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'

# Read-only is all this workflow ever does; declaring it keeps the repository's default
# permissions from silently applying.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    # The release builds the .deb on the same image, so the gate sees the libraries the
    # package is linked against.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      # fontconfig is the one desktop library the client links; Slint's windowing and GPU
      # libraries are loaded at run time and need no headers.
      - name: Install the libraries and the shell-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev libsqlite3-dev pkg-config cmake \
            dbus-daemon desktop-file-utils appstream shellcheck

      # rust-toolchain.toml pins the channel; rustup reads it on first use.
      - name: Show the toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A session bus, because tidemark-core's Secret Service tests skip themselves
      # without one and tidemarkd opens a session connection. With a bus but no Secret
      # Service the keyring assertions still skip, which is the designed behaviour.
      - name: Tests
        run: dbus-run-session -- cargo test --workspace

      - name: Layering
        run: scripts/check-layering.sh

      - name: Desktop integration
        run: scripts/check-desktop-integration.sh

      - name: The user-daemon restart helper
        run: scripts/test-restart-user-daemon.sh

      - name: Shell
        run: |
          shellcheck scripts/*.sh data/restart-user-daemon \
            data/packaging/deb/postinst data/packaging/rpm/post-install.sh

  # The same gate on Windows: fmt, clippy and the whole suite, on MSYS2 UCRT64. The
  # MSVC target has never linked this dependency set (link.exe 1181) and is not what
  # the project ships, so the GNU toolchain is the one thing this job insists on.
  # Unix-only tests cfg-gate themselves out at their seams, so a red run here is a real
  # regression.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # RUSTUP_TOOLCHAIN outranks both `rustup default` and the repo's
      # rust-toolchain.toml (which pins only channel=stable, i.e. the runner's
      # MSVC host); without it the toolchain file would silently flip every
      # cargo invocation back to MSVC.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      # The UCRT64 pkgconfig trees backing the system SQLite the daemon links.
      PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2.27.0
        with:
          msystem: UCRT64
          update: true
          # path-type: inherit keeps the runner's PATH (notably ~/.cargo/bin)
          # inside the msys2 shell; the default "minimal" rebuilds PATH from
          # /etc/profile alone and drops it, which would kill every cargo step.
          # /etc/profile still puts /ucrt64/bin first, so pkg-config/gcc/cmake
          # keep winning. sqlite3: rusqlite links the SYSTEM SQLite. clang and
          # cmake build BoringSSL behind wreq (bindgen at build time).
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-go

      # Before any cargo step: prove the MSYS2 environment resolved. The sqlite3
      # modversion MUST appear in the log (this step fails if it is missing).
      - name: Confirm the MSYS2 environment
        shell: msys2 {0}
        run: |
          pkg-config --modversion sqlite3
          command -v gcc g++ clang cmake cargo rustup

      # A full GNU-host toolchain, not just target std: build scripts and proc
      # macros link for the HOST too. Host==target==GNU, so the verbatim cargo
      # commands build GNU throughout and link with gcc from /ucrt64.
      - name: Default a GNU-host Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          # minimal profile ships no rustfmt/clippy; the gate below needs both.
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ucrt64-tests

      # NO continue-on-error anywhere: a failure fails the job.
      - name: Format
        shell: msys2 {0}
        run: cargo fmt --all --check

      - name: Clippy
        shell: msys2 {0}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        shell: msys2 {0}
        run: cargo test --workspace
