[workspace]

[package]
name = "tidemark-ipc-p2p-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
fs4 = "1.1.0"
futures-util = "0.3.32"
thiserror = "2.0.20"
tidemark-types = { path = "../../crates/tidemark-types" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zbus = { version = "=5.19.0", features = ["p2p"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[[bin]]
name = "ipc-p2p-server"
path = "src/bin/server.rs"

[[bin]]
name = "ipc-p2p-client"
path = "src/bin/client.rs"

[[bin]]
name = "ipc-p2p-g1"
path = "src/bin/g1.rs"
