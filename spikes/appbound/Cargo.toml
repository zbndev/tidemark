[package]
name = "appbound-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.1"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["block-padding"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
rusqlite = "0.40.2"
serde_json = "1.0.151"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
tidemark-types = { path = "../../crates/tidemark-types" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com"] }
